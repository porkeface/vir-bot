<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vir-bot Chat</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232733;
      --border: #2d3140;
      --text: #e4e4e7;
      --text2: #a1a1aa;
      --text3: #71717a;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --radius: 12px;
      --radius-sm: 8px;
      --max-w: 800px;
    }

    html,
    body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: var(--max-w);
      margin: 0 auto;
    }

    @media (max-width: 800px) {
      #app {
        max-width: 100%;
      }
    }

    /* ── Header ─────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .header-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .header-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* ── Messages ───────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .msg {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .msg-user {
      justify-content: flex-end;
    }

    .msg-assistant {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    .msg-user .bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-assistant .bubble {
      background: var(--surface2);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .bubble p {
      margin: 0 0 8px 0;
    }

    .bubble p:last-child {
      margin-bottom: 0;
    }

    .bubble code {
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 13px;
    }

    .bubble pre {
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      margin: 8px 0;
    }

    .bubble pre code {
      background: none;
      padding: 0;
    }

    .bubble a {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .bubble blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 10px;
      margin: 8px 0;
      color: var(--text2);
    }

    .bubble ul,
    .bubble ol {
      padding-left: 20px;
      margin: 4px 0;
    }

    /* ── Typing Dots ────────────────────── */
    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      background: var(--text3);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    /* ── Status Bar ─────────────────────── */
    .status-bar {
      text-align: center;
      padding: 4px;
      font-size: 12px;
      color: var(--text3);
      flex-shrink: 0;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }

    .status-connected .status-dot {
      background: #22c55e;
    }

    .status-disconnected .status-dot {
      background: #ef4444;
    }

    .status-connecting .status-dot {
      background: #eab308;
      animation: pulse 1s infinite;
    }

    /* ── Input Area ─────────────────────── */
    .input-area {
      padding: 12px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .input-row textarea {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      outline: none;
      font-family: inherit;
      max-height: 120px;
      min-height: 42px;
      transition: border-color 0.2s;
    }

    .input-row textarea:focus {
      border-color: var(--accent);
    }

    .input-row textarea::placeholder {
      color: var(--text3);
    }

    .btn-icon {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      font-size: 18px;
    }

    .btn-icon:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-mic.recording {
      background: #ef4444;
      color: #fff;
      border-color: #ef4444;
      animation: pulse 1.2s infinite;
    }

    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-send:disabled:hover {
      background: var(--surface2);
      color: var(--text2);
      border-color: var(--border);
    }

    /* ── Audio Playback ─────────────────── */
    .audio-wrap {
      margin-top: 8px;
    }

    .audio-wrap audio {
      width: 100%;
      max-width: 280px;
      height: 36px;
      border-radius: 8px;
    }

    /* ── Welcome ────────────────────────── */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text3);
      gap: 8px;
      padding: 24px;
    }

    .welcome-icon {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .welcome h2 {
      font-size: 20px;
      color: var(--text2);
      font-weight: 500;
    }

    .welcome p {
      font-size: 14px;
      text-align: center;
      max-width: 320px;
      line-height: 1.6;
    }

    /* ── Token Prompt ───────────────────── */
    .token-prompt {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
    }

    .token-prompt input {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      width: 280px;
      max-width: 90%;
      outline: none;
    }

    .token-prompt input:focus {
      border-color: var(--accent);
    }

    .token-prompt button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .token-prompt button:hover {
      background: var(--accent-hover);
    }

    .token-prompt label {
      color: var(--text2);
      font-size: 14px;
    }

    /* ── Animations ─────────────────────── */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.7;
      }
    }

    @keyframes bounce {
      0%,
      80%,
      100% {
        transform: scale(0);
      }
      40% {
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Token Prompt -->
    <div v-if="!token" class="token-prompt">
      <label>请输入访问 Token</label>
      <input
        v-model="tokenInput"
        placeholder="Token"
        @keyup.enter="saveToken"
      />
      <button @click="saveToken">连接</button>
    </div>

    <!-- Chat Interface -->
    <template v-else>
      <!-- Header -->
      <div class="header">
        <span class="header-title">vir-bot Chat</span>
        <button class="header-btn" @click="showCard = !showCard">
          {{ showCard ? '关闭' : '角色卡' }}
        </button>
      </div>

      <!-- Character Card (simple overlay) -->
      <div
        v-if="showCard"
        style="
          padding: 12px 16px;
          background: var(--surface2);
          border-bottom: 1px solid var(--border);
          font-size: 13px;
          color: var(--text2);
          line-height: 1.6;
        "
      >
        <strong style="color: var(--text)">角色卡</strong>
        <p style="margin-top: 4px">
          这里可以展示角色卡信息。后续接入后端角色卡 API。
        </p>
      </div>

      <!-- Messages -->
      <div class="messages" ref="messagesEl">
        <!-- Welcome -->
        <div v-if="messages.length === 0 && !streaming" class="welcome">
          <div class="welcome-icon">🤖</div>
          <h2>vir-bot</h2>
          <p>你好！我是 vir-bot，有什么想聊的？</p>
        </div>

        <!-- Message List -->
        <div
          v-for="(msg, i) in messages"
          :key="i"
          :class="['msg', msg.role === 'user' ? 'msg-user' : 'msg-assistant']"
        >
          <div class="bubble" v-html="renderMarkdown(msg.content)"></div>
          <div v-if="msg.audioUrl" class="audio-wrap" style="max-width: 80%">
            <audio :src="msg.audioUrl" controls preload="none"></audio>
          </div>
        </div>

        <!-- Streaming Message -->
        <div
          v-if="streaming"
          class="msg msg-assistant"
        >
          <div class="bubble" v-html="renderMarkdown(streamContent)"></div>
        </div>

        <!-- Typing Dots -->
        <div v-if="waiting && !streaming" class="msg msg-assistant">
          <div class="bubble">
            <div class="typing-dots">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Status Bar -->
      <div :class="['status-bar', statusClass]">
        <span class="status-dot"></span>
        {{ statusText }}
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <div class="input-row">
          <textarea
            ref="inputEl"
            v-model="inputText"
            placeholder="输入消息..."
            rows="1"
            @input="autoResize"
            @keydown="handleKeydown"
          ></textarea>
          <button
            :class="['btn-icon', 'btn-mic', { recording: isRecording }]"
            @click="toggleMic"
            :title="isRecording ? '停止录音' : '语音输入'"
          >
            <template v-if="isRecording">⏹</template>
            <template v-else>🎤</template>
          </button>
          <button
            class="btn-icon btn-send"
            :disabled="!inputText.trim() || waiting"
            @click="sendMessage"
            title="发送"
          >
            ▶
          </button>
        </div>
      </div>
    </template>
  </div>

  <script>
    const { createApp, ref, computed, watch, nextTick, onMounted, onBeforeUnmount } = Vue;

    // Configure marked
    marked.setOptions({ breaks: true, gfm: true });

    createApp({
      setup() {
        // ── Token ──────────────────────
        const token = ref(localStorage.getItem('vb_token') || '');
        const tokenInput = ref('');

        function saveToken() {
          const t = tokenInput.value.trim();
          if (t) {
            token.value = t;
            localStorage.setItem('vb_token', t);
            connectWS();
          }
        }

        // ── State ──────────────────────
        const messages = ref([]);
        const inputText = ref('');
        const waiting = ref(false);
        const streaming = ref(false);
        const streamContent = ref('');
        const showCard = ref(false);
        const isRecording = ref(false);

        // ── Refs ───────────────────────
        const messagesEl = ref(null);
        const inputEl = ref(null);

        // ── WebSocket ──────────────────
        let ws = null;
        let reconnectTimer = null;

        const connStatus = ref('disconnected'); // connected | disconnected | connecting

        const statusClass = computed(() => {
          return 'status-' + connStatus.value;
        });

        const statusText = computed(() => {
          switch (connStatus.value) {
            case 'connected':
              return '已连接';
            case 'connecting':
              return '连接中...';
            default:
              return '未连接';
          }
        });

        function connectWS() {
          if (!token.value) return;
          if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
            return;
          }

          connStatus.value = 'connecting';

          const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
          const url = `${proto}//${location.host}/api/chat/ws?token=${encodeURIComponent(token.value)}`;

          ws = new WebSocket(url);

          ws.onopen = () => {
            connStatus.value = 'connected';
            if (reconnectTimer) {
              clearTimeout(reconnectTimer);
              reconnectTimer = null;
            }
          };

          ws.onmessage = (evt) => {
            let data;
            try {
              data = JSON.parse(evt.data);
            } catch {
              return;
            }
            handleMessage(data);
          };

          ws.onclose = () => {
            connStatus.value = 'disconnected';
            scheduleReconnect();
          };

          ws.onerror = () => {
            connStatus.value = 'disconnected';
          };
        }

        function scheduleReconnect() {
          if (reconnectTimer) return;
          reconnectTimer = setTimeout(() => {
            reconnectTimer = null;
            connectWS();
          }, 3000);
        }

        function handleMessage(data) {
          switch (data.type) {
            case 'text_delta':
              if (!streaming.value) {
                streaming.value = true;
                streamContent.value = '';
                waiting.value = false;
              }
              streamContent.value += data.delta || '';
              scrollToBottom();
              break;

            case 'text_done':
              if (streaming.value) {
                messages.value.push({
                  role: 'assistant',
                  content: streamContent.value,
                  audioUrl: null,
                });
                streaming.value = false;
                streamContent.value = '';
              }
              waiting.value = false;
              scrollToBottom();
              break;

            case 'voice_url':
              if (messages.value.length > 0) {
                const last = messages.value[messages.value.length - 1];
                if (last.role === 'assistant') {
                  last.audioUrl = data.url;
                }
              }
              break;

            case 'status':
              if (data.status === 'thinking') {
                waiting.value = true;
              } else if (data.status === 'idle') {
                waiting.value = false;
              }
              break;

            case 'error':
              messages.value.push({
                role: 'assistant',
                content: '**Error:** ' + (data.message || '未知错误'),
                audioUrl: null,
              });
              waiting.value = false;
              streaming.value = false;
              scrollToBottom();
              break;
          }
        }

        // ── Send ───────────────────────
        function sendMessage() {
          const text = inputText.value.trim();
          if (!text || waiting.value) return;

          messages.value.push({
            role: 'user',
            content: text,
            audioUrl: null,
          });

          inputText.value = '';
          autoResize();
          scrollToBottom();

          waiting.value = true;

          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'text', content: text }));
          } else {
            messages.value.push({
              role: 'assistant',
              content: '**Error:** WebSocket 未连接，请稍后重试。',
              audioUrl: null,
            });
            waiting.value = false;
            scrollToBottom();
          }
        }

        // ── Keyboard ───────────────────
        function handleKeydown(e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        }

        // ── Auto Resize Textarea ───────
        function autoResize() {
          nextTick(() => {
            const el = inputEl.value;
            if (!el) return;
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
          });
        }

        // ── Scroll ─────────────────────
        function scrollToBottom() {
          nextTick(() => {
            const el = messagesEl.value;
            if (el) {
              el.scrollTop = el.scrollHeight;
            }
          });
        }

        // ── Markdown ───────────────────
        function renderMarkdown(text) {
          if (!text) return '';
          try {
            return marked.parse(text);
          } catch {
            return text;
          }
        }

        // ── Voice Input (Web Speech API) ─
        let recognition = null;

        function initRecognition() {
          const SpeechRecognition =
            window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechRecognition) return null;

          const rec = new SpeechRecognition();
          rec.lang = 'zh-CN';
          rec.continuous = false;
          rec.interimResults = false;

          rec.onstart = () => {
            // 用户开始说话时发送打断信号
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: 'interrupt' }));
            }
          };

          rec.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            if (transcript) {
              inputText.value = transcript;
              autoResize();
              sendMessage();
            }
            isRecording.value = false;
          };

          rec.onerror = () => {
            isRecording.value = false;
          };

          rec.onend = () => {
            isRecording.value = false;
          };

          return rec;
        }

        function toggleMic() {
          if (isRecording.value) {
            if (recognition) recognition.stop();
            isRecording.value = false;
            return;
          }

          if (!recognition) {
            recognition = initRecognition();
          }

          if (!recognition) {
            alert('您的浏览器不支持语音输入，请使用 Chrome。');
            return;
          }

          isRecording.value = true;
          try {
            recognition.start();
          } catch {
            isRecording.value = false;
          }
        }

        // ── Lifecycle ──────────────────
        onMounted(() => {
          // Check URL params for token
          const params = new URLSearchParams(window.location.search);
          const urlToken = params.get('token');
          if (urlToken) {
            token.value = urlToken;
            localStorage.setItem('vb_token', urlToken);
          }

          if (token.value) {
            connectWS();
          }

          // Focus input
          nextTick(() => {
            if (inputEl.value) inputEl.value.focus();
          });
        });

        onBeforeUnmount(() => {
          if (ws) ws.close();
          if (reconnectTimer) clearTimeout(reconnectTimer);
          if (recognition) recognition.abort();
        });

        return {
          token,
          tokenInput,
          saveToken,
          messages,
          inputText,
          waiting,
          streaming,
          streamContent,
          showCard,
          isRecording,
          messagesEl,
          inputEl,
          connStatus,
          statusClass,
          statusText,
          sendMessage,
          handleKeydown,
          autoResize,
          renderMarkdown,
          toggleMic,
        };
      },
    }).mount('#app');
  </script>
</body>
</html>
