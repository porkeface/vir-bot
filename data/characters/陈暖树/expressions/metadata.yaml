# 角色表情配置
# 每种情绪对应一个文件夹，文件夹内放置表情图片
# weight: 出现权重 (1=正常, 0.5=较少出现, 0.3=很少出现)
# tags: 触发该情绪的关键词列表

expressions:
  neutral:
    tags: ["嗯", "好吧", "知道了", "好的", "哦", "这样啊"]
    weight: 1

  joy:
    tags: ["哈哈", "开心", "高兴", "嘻嘻", "笑", "太好了", "好耶", "耶", "嘿嘿", "棒"]
    weight: 1

  anger:
    tags: ["生气", "讨厌", "哼", "烦", "气死了", "气死", "滚", "讨厌死了"]
    weight: 0.8

  sadness:
    tags: ["难过", "伤心", "呜呜", "哭", "好难过", "呜", "委屈", "不开心"]
    weight: 0.7

  surprise:
    tags: ["啊", "诶", "真的吗", "不会吧", "天哪", "哇", "居然", "没想到"]
    weight: 0.8

  fear:
    tags: ["害怕", "好可怕", "吓死了", "吓", "不敢", "瑟瑟发抖"]
    weight: 0.5

  disgust:
    tags: ["恶心", "讨厌死了", "呕", "受不了", "过分"]
    weight: 0.3

  embarrassment:
    tags: ["害羞", "才没有", "不要说", "讨厌啦", "哎呀", "你说什么呢", "别这样"]
    weight: 0.8

  smirk:
    tags: ["哼哼", "嘿嘿", "是吗", "切", "随便你", "谁稀罕", "才不是呢"]
    weight: 0.6

  blush:
    tags: ["脸红", "心跳", "好害羞", "心跳加速", "脸好烫"]
    weight: 0.5

  thinking:
    tags: ["嗯...", "让我想想", "这个嘛", "我想想", "emmm", "额"]
    weight: 0.4

  wink:
    tags: [" wink", "😉", "你猜", "秘密", "不告诉你"]
    weight: 0.3
